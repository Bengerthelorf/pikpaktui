[package]
name = "pikpak-android"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
base64 = "0.22"
hmac = "0.12"
jni = "0.21.1"
md-5 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["parsing", "formatting"] }

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = true

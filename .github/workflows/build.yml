name: Build and Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*.*.*'

  pull_request:
    branches: [ main, master ]

  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check compilation
        run: cargo check --verbose

      - name: Run unit tests
        run: cargo test --verbose

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Check formatting
        run: cargo fmt --check

      - name: Test shell completions (all shells)
        shell: bash
        run: |
          cargo run -- completions bash > /dev/null
          cargo run -- completions zsh > /dev/null
          cargo run -- completions fish > /dev/null
          cargo run -- completions powershell > /dev/null
          echo "All completion scripts generated successfully"

      - name: Test PowerShell completions (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $output = cargo run -- completions powershell 2>$null
          if (-not $output) { throw "Empty completion output" }

          $regCount = ($output | Select-String "Register-ArgumentCompleter").Count
          if ($regCount -ne 1) { throw "Expected 1 Register-ArgumentCompleter, got $regCount" }

          $output | Out-String | Invoke-Expression
          Write-Host "PowerShell completions loaded successfully"

      - name: Test version and help
        shell: bash
        run: |
          cargo run -- --version
          cargo run -- --help
          cargo run -- completions --help
          echo "Help/version tests passed"

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: pikpaktui-x86_64-linux
            strip: true
            ext: ""

          - target: x86_64-apple-darwin
            os: macos-latest
            name: pikpaktui-x86_64-macos
            strip: true
            ext: ""

          - target: aarch64-apple-darwin
            os: macos-latest
            name: pikpaktui-aarch64-macos
            strip: true
            ext: ""

          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            name: pikpaktui-aarch64-linux
            strip: false
            cross: true
            ext: ""

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: pikpaktui-x86_64-windows
            strip: false
            ext: ".exe"

          - target: aarch64-pc-windows-msvc
            os: windows-latest
            name: pikpaktui-aarch64-windows
            strip: false
            ext: ".exe"

          - target: x86_64-unknown-freebsd
            os: ubuntu-latest
            name: pikpaktui-x86_64-freebsd
            strip: false
            cross: true
            ext: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Configure build environment
        shell: bash
        run: |
          echo "TARGET_FLAGS=--target ${{ matrix.target }}" >> $GITHUB_ENV
          echo "TARGET_DIR=./target/${{ matrix.target }}" >> $GITHUB_ENV

      - name: Build binary
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build binary (cross)
        if: ${{ matrix.cross }}
        run: cross build --release --target ${{ matrix.target }}

      - name: Strip binary
        if: matrix.strip
        run: strip target/${{ matrix.target }}/release/pikpaktui${{ matrix.ext }}

      - name: Prepare binary
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/pikpaktui${{ matrix.ext }} dist/

      - name: Upload binary
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.name }}
          path: dist/*

  release-guard:
    name: Validate Release Tag
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify tag, package version, and main ancestry
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Release tag must be an exact vX.Y.Z semantic version: $TAG"
            exit 1
          fi
          TAG_VERSION="${BASH_REMATCH[1]}"

          MANIFEST_VERSION=$(awk -F '"' '/^version = "/ { print $2; exit }' Cargo.toml)
          LOCK_VERSION=$(
            awk -F '"' \
              '$0 == "name = \"pikpaktui\"" { getline; if ($0 ~ /^version = "/) { print $2; exit } }' \
              Cargo.lock
          )
          if [[ -z "$MANIFEST_VERSION" || -z "$LOCK_VERSION" ]]; then
            echo "::error::Could not read the pikpaktui version from Cargo.toml and Cargo.lock."
            exit 1
          fi
          if [[ "$TAG_VERSION" != "$MANIFEST_VERSION" || "$TAG_VERSION" != "$LOCK_VERSION" ]]; then
            echo "::error::Version mismatch: tag=$TAG_VERSION Cargo.toml=$MANIFEST_VERSION Cargo.lock=$LOCK_VERSION"
            exit 1
          fi

          git fetch --quiet origin "+refs/heads/main:refs/remotes/origin/main"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "refs/remotes/origin/main"; then
            echo "::error::Release commit $GITHUB_SHA is not part of origin/main."
            exit 1
          fi

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, release-guard]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist

      - name: Prepare release assets
        run: |
          cd dist
          for dir in */; do
            name="${dir%/}"
            cd "$dir"
            if ls *.exe 1>/dev/null 2>&1; then
              zip "../${name}.zip" pikpaktui.exe
            else
              chmod +x pikpaktui
              tar czf "../${name}.tar.gz" pikpaktui
            fi
            cd ..
          done
          sha256sum *.tar.gz *.zip > sha256sums.txt

      - name: Generate changelog
        id: changelog
        run: |
          CURRENT_TAG=${GITHUB_REF#refs/tags/}
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          echo "## Changelog" > CHANGELOG.md
          echo "" >> CHANGELOG.md

          if [ -n "$PREVIOUS_TAG" ]; then
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREVIOUS_TAG}...${CURRENT_TAG}" >> CHANGELOG.md
            echo "" >> CHANGELOG.md

            # Categorize commits by conventional commit prefixes
            echo "### Changes since ${PREVIOUS_TAG}:" >> CHANGELOG.md
            echo "" >> CHANGELOG.md

            FEATS=$(git log --pretty=format:"- %s (%h)" ${PREVIOUS_TAG}..HEAD | grep -i "^- feat" || true)
            FIXES=$(git log --pretty=format:"- %s (%h)" ${PREVIOUS_TAG}..HEAD | grep -i "^- fix" || true)
            OTHERS=$(git log --pretty=format:"- %s (%h)" ${PREVIOUS_TAG}..HEAD | grep -iv "^- feat\|^- fix\|^- chore\|^- docs\|^- ci" || true)
            CHORES=$(git log --pretty=format:"- %s (%h)" ${PREVIOUS_TAG}..HEAD | grep -i "^- chore\|^- docs\|^- ci" || true)

            if [ -n "$FEATS" ]; then
              echo "#### Features" >> CHANGELOG.md
              echo "$FEATS" >> CHANGELOG.md
              echo "" >> CHANGELOG.md
            fi

            if [ -n "$FIXES" ]; then
              echo "#### Bug Fixes" >> CHANGELOG.md
              echo "$FIXES" >> CHANGELOG.md
              echo "" >> CHANGELOG.md
            fi

            if [ -n "$OTHERS" ]; then
              echo "#### Other" >> CHANGELOG.md
              echo "$OTHERS" >> CHANGELOG.md
              echo "" >> CHANGELOG.md
            fi

            if [ -n "$CHORES" ]; then
              echo "<details><summary>Maintenance</summary>" >> CHANGELOG.md
              echo "" >> CHANGELOG.md
              echo "$CHORES" >> CHANGELOG.md
              echo "" >> CHANGELOG.md
              echo "</details>" >> CHANGELOG.md
              echo "" >> CHANGELOG.md
            fi
          else
            echo "### Initial Release" >> CHANGELOG.md
            git log --pretty=format:"- %s (%h)" >> CHANGELOG.md
          fi

          echo "" >> CHANGELOG.md
          echo "## Download" >> CHANGELOG.md
          echo "Choose the appropriate binary for your platform:" >> CHANGELOG.md
          echo "- **Linux x86_64**: pikpaktui-x86_64-linux.tar.gz (statically linked)" >> CHANGELOG.md
          echo "- **Linux ARM64**: pikpaktui-aarch64-linux.tar.gz (statically linked)" >> CHANGELOG.md
          echo "- **macOS Intel**: pikpaktui-x86_64-macos.tar.gz" >> CHANGELOG.md
          echo "- **macOS Apple Silicon**: pikpaktui-aarch64-macos.tar.gz" >> CHANGELOG.md
          echo "- **Windows x86_64**: pikpaktui-x86_64-windows.zip" >> CHANGELOG.md
          echo "- **Windows ARM64**: pikpaktui-aarch64-windows.zip" >> CHANGELOG.md
          echo "- **FreeBSD x86_64**: pikpaktui-x86_64-freebsd.tar.gz" >> CHANGELOG.md

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/sha256sums.txt
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crate:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: [release, release-guard]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Publish to crates.io
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  update-tap:
    name: Update Homebrew Formula
    timeout-minutes: 40
    runs-on: ubuntu-latest
    needs: [release, release-guard]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Publish checked Homebrew update
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)" == true ]]; then
            echo "Prereleases do not update the stable Homebrew tap"
            exit 0
          fi
          gh auth setup-git
          TAP_DIR="$RUNNER_TEMP/homebrew-tap"
          gh repo clone Bengerthelorf/homebrew-tap "$TAP_DIR"
          bash "$TAP_DIR/scripts/publish-update.sh" pikpaktui "$TAG"
